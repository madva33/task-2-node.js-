<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Weather Check</h1>
        <form id="weatherForm">
            <input id="address" type="text" placeholder="Enter country or city name" required>
            <button type="submit">Get Weather</button>
        </form>
        <p id="message"></p>
        <section id="result" class="result" hidden>
            <p id="location"></p>
            <p id="latitude"></p>
            <p id="longitude"></p>
            <p id="condition"></p>
            <p id="temperature"></p>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
